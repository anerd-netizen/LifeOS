<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeOS · Personal productivity</title>
    <meta name="description" content="LifeOS is a calm, all-in-one workspace for tasks, habits, calendar, focus sessions, notes and analytics." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var s = (JSON.parse(localStorage.getItem('lifeos:v1') || '{}').settings) || {};
          var t = s.theme || 'system';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
</head>
  <body>
    <a class="skip-link" href="#view">Skip to main content</a>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <div class="sb-brand">
          <a href="#/overview" class="logo" aria-label="LifeOS home">
            <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--primary)"/><circle cx="16" cy="16" r="7.5" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2.5"/><path d="M11.5 16.3l3.2 3.2 6-6.4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="sb-label">LifeOS</span>
          </a>
          <button type="button" class="icon-btn sb-close" id="nav-close" aria-label="Close menu"><i data-lucide="x"></i></button>
        </div>
        <nav class="sb-nav" aria-label="Sections">
          <ul>
            <li><a class="nav-link" href="#/overview" data-route="overview" title="Overview"><i data-lucide="layout-dashboard"></i><span class="sb-label">Overview</span></a></li>
            <li><a class="nav-link" href="#/tasks" data-route="tasks" title="My Tasks"><i data-lucide="list-checks"></i><span class="sb-label">My Tasks</span></a></li>
            <li><a class="nav-link" href="#/habits" data-route="habits" title="Habits"><i data-lucide="repeat"></i><span class="sb-label">Habits</span></a></li>
            <li><a class="nav-link" href="#/calendar" data-route="calendar" title="Calendar"><i data-lucide="calendar-days"></i><span class="sb-label">Calendar</span></a></li>
            <li><a class="nav-link" href="#/focus" data-route="focus" title="Focus Mode"><i data-lucide="timer"></i><span class="sb-label">Focus Mode</span></a></li>
            <li><a class="nav-link" href="#/notes" data-route="notes" title="Notes"><i data-lucide="sticky-note"></i><span class="sb-label">Notes</span></a></li>
            <li><a class="nav-link" href="#/analytics" data-route="analytics" title="Analytics"><i data-lucide="chart-column"></i><span class="sb-label">Analytics</span></a></li>
          </ul>
        </nav>
        <div class="sb-bottom">
          <a class="nav-link" href="#/settings" data-route="settings" title="Settings"><i data-lucide="settings"></i><span class="sb-label">Settings</span></a>
          <button type="button" class="nav-link collapse-btn" id="collapse-btn" aria-label="Collapse sidebar" title="Toggle sidebar"></button>
        </div>
      </aside>
      <div class="scrim" id="scrim"></div>
      <div class="main">
        <header class="topbar">
          <div class="topbar-left">
            <button type="button" class="icon-btn menu-btn" id="nav-open" aria-label="Open menu" aria-expanded="false"><i data-lucide="menu"></i></button>
            <h1 class="topbar-title" id="page-title">Overview</h1>
          </div>
          <div class="search" role="search">
            <i data-lucide="search"></i>
            <input id="global-search" type="search" placeholder="Search tasks, notes, habits…" aria-label="Search tasks, notes and habits" autocomplete="off" />
            <kbd aria-hidden="true">/</kbd>
            <div id="search-results" class="popover search-pop" hidden></div>
          </div>
          <div class="topbar-right">
            <a href="#/focus" class="timer-pill" id="timer-pill" hidden aria-label="Focus timer running. Open Focus Mode"><i data-lucide="timer"></i><span id="timer-pill-time">25:00</span></a>
            <span class="date-chip" id="date-chip"><i data-lucide="calendar"></i><span></span></span>
            <div class="pop-wrap">
              <button type="button" class="icon-btn" id="notif-btn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false"><i data-lucide="bell"></i><span class="badge-dot" id="notif-badge" hidden></span></button>
              <div class="popover notif-pop" id="notif-pop" hidden></div>
            </div>
            <button type="button" class="icon-btn" id="theme-btn" aria-label="Toggle theme"></button>
            <a href="#/settings" class="avatar" id="avatar" aria-label="Profile and settings">U</a>
          </div>
        </header>
        <main id="view" class="view" tabindex="-1"></main>
      </div>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <noscript><p style="padding:2rem;font-family:sans-serif">LifeOS needs JavaScript enabled to run.</p></noscript>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
